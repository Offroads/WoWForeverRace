name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache external libraries
        uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ hashFiles('.pkgmeta') }}

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wowforeverrace-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint
        run: docker compose run --rm dev make lint

      - name: Tests
        run: docker compose run --rm dev make tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luacov-report
          path: luacov.report.out
          if-no-files-found: ignore
