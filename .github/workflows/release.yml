name: Release

# Tag a commit (e.g. `git tag v1.0.0 && git push --tags`) to build the addon zip
# with the BigWigs packager and attach it to a GitHub release. The tag name
# becomes the addon version (@project-version@ in the TOC and config.lua).
#
# Uploads to CurseForge / Wago / WoWInterface only happen when the matching
# secret is configured in the repository settings.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the Ace3 externals in .pkgmeta are svn repositories, the runner image has no svn
      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      # One zip for the WoW Forever client, the only interface in the TOC.
      # The packager labels the WoW Forever interface (16xxx) as retail in
      # release.json until it learns that client. The CurseForge project id
      # comes from X-Curse-Project-ID in the TOC.
      - name: Package with BigWigs packager
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
